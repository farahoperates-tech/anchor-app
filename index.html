<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Anchor</title>
  <meta name="description" content="A one-tap panic attack companion. Your own words, your own people, ready when you need them." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3D5A63" />

  <!-- iOS full-screen web app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Anchor" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ OPENING ============ -->
  <div id="intro" class="intro hidden" aria-hidden="true">
    <p class="intro-welcome" data-i18n="intro.welcome"></p>
    <p class="intro-text" data-i18n="intro.arrived"></p>
    <p class="intro-skip" data-i18n="intro.skip"></p>
  </div>

  <!-- ============ SETUP / SETTINGS ============ -->
  <section id="screen-setup" class="screen">
    <div class="setup-inner">
      <header class="setup-header">
        <button id="setup-back" class="icon-btn hidden" data-i18n-aria="setup.back">←</button>
        <h1 id="setup-title"></h1>
        <p id="setup-sub"></p>
      </header>

      <div class="field-group">
        <h2 data-i18n="setup.person.title"></h2>
        <p class="hint" data-i18n="setup.person.hint"></p>
        <label class="field">
          <span data-i18n="setup.person.name"></span>
          <input id="in-safe-name" type="text" autocomplete="off" data-i18n-ph="setup.person.namePh" />
        </label>
        <label class="field">
          <span data-i18n="setup.person.phone"></span>
          <input id="in-safe-phone" type="tel" autocomplete="off" data-i18n-ph="setup.person.phonePh" />
        </label>
        <label class="field">
          <span data-i18n="setup.person.sms"></span>
          <textarea id="in-safe-sms" rows="2" data-i18n-ph="panic.smsDefault"></textarea>
        </label>
        <div class="field">
          <span data-i18n="setup.person.voice"></span>
          <p class="hint tip" data-i18n="setup.person.voiceTip"></p>
          <div class="voice-row">
            <button type="button" class="voice-btn" id="voice-rec-1" data-i18n="setup.person.record"></button>
            <button type="button" class="voice-btn" id="voice-up-1" data-i18n="setup.person.upload"></button>
            <button type="button" class="voice-btn hidden" id="voice-play-1" data-i18n="setup.person.play"></button>
            <button type="button" class="voice-btn hidden" id="voice-del-1" data-i18n="setup.person.remove"></button>
          </div>
          <input type="file" id="voice-file-1" accept="audio/*" class="hidden" />
          <p class="hint voice-status" id="voice-status-1"></p>
        </div>

        <div id="person2-fields" class="hidden">
          <h2 class="person2-title" data-i18n="setup.person2.title"></h2>
          <p class="hint" data-i18n="setup.person2.hint"></p>
          <label class="field">
            <span data-i18n="setup.person.name"></span>
            <input id="in-safe-name2" type="text" autocomplete="off" data-i18n-ph="setup.person2.namePh" />
          </label>
          <label class="field">
            <span data-i18n="setup.person.phone"></span>
            <input id="in-safe-phone2" type="tel" autocomplete="off" data-i18n-ph="setup.person.phonePh" />
          </label>
          <label class="field">
            <span data-i18n="setup.person.sms"></span>
            <textarea id="in-safe-sms2" rows="2" data-i18n-ph="panic.smsDefault"></textarea>
          </label>
          <div class="field">
            <span data-i18n="setup.person.voice"></span>
            <p class="hint tip" data-i18n="setup.person.voiceTip"></p>
            <div class="voice-row">
              <button type="button" class="voice-btn" id="voice-rec-2" data-i18n="setup.person.record"></button>
              <button type="button" class="voice-btn" id="voice-up-2" data-i18n="setup.person.upload"></button>
              <button type="button" class="voice-btn hidden" id="voice-play-2" data-i18n="setup.person.play"></button>
              <button type="button" class="voice-btn hidden" id="voice-del-2" data-i18n="setup.person.remove"></button>
            </div>
            <input type="file" id="voice-file-2" accept="audio/*" class="hidden" />
            <p class="hint voice-status" id="voice-status-2"></p>
          </div>
        </div>
        <button type="button" id="person-add" class="ghost-btn slim" data-i18n="setup.addPerson"></button>
      </div>

      <div class="field-group">
        <h2 data-i18n="setup.techniques.title"></h2>
        <p class="hint sourced" data-i18n="setup.techniques.sourced"></p>
        <p class="hint" data-i18n="setup.techniques.hint"></p>
        <div class="choice-row choice-col" role="group" data-i18n-aria="setup.techniques.aria">
          <button class="choice multi" data-value="box"><span data-i18n="techniques.box.name"></span><small data-i18n="techniques.box.sub"></small></button>
          <button class="choice multi" data-value="extended"><span data-i18n="techniques.extended.name"></span><small data-i18n="techniques.extended.sub"></small></button>
          <button class="choice multi" data-value="armraise"><span data-i18n="techniques.armraise.name"></span><small data-i18n="techniques.armraise.sub"></small></button>
          <button class="choice multi" data-value="54321"><span data-i18n="techniques.s54321.name"></span><small data-i18n="techniques.s54321.sub"></small></button>
          <button class="choice multi" data-value="pmr"><span data-i18n="techniques.pmr.name"></span><small data-i18n="techniques.pmr.sub"></small></button>
          <button class="choice multi" data-value="tipp"><span data-i18n="techniques.tipp.name"></span><small data-i18n="techniques.tipp.sub"></small></button>
          <button class="choice multi" data-value="voice"><span data-i18n="techniques.voice.name"></span><small data-i18n="techniques.voice.sub"></small></button>
          <button class="choice multi" data-value="song"><span data-i18n="techniques.song.name"></span><small data-i18n="techniques.song.sub"></small></button>
        </div>
      </div>

      <div class="field-group">
        <h2 data-i18n="setup.sound.title"></h2>
        <p class="hint" data-i18n="setup.sound.hint"></p>
        <div class="choice-row" role="radiogroup" data-i18n-aria="setup.sound.aria">
          <button class="choice" data-group="music" data-value="playlist" data-i18n="setup.sound.mySongs"></button>
          <button class="choice" data-group="music" data-value="tone" data-i18n="setup.sound.tone"></button>
        </div>
        <div id="songs-field">
          <div id="songs-list"></div>
          <div class="voice-row">
            <button type="button" id="song-add" class="voice-btn" data-i18n="setup.sound.addLink"></button>
            <button type="button" id="song-upload" class="voice-btn" data-i18n="setup.sound.uploadFile"></button>
          </div>
          <input type="file" id="song-file" accept="audio/*" class="hidden" />
          <p class="hint voice-status" id="song-status"></p>
        </div>
      </div>

      <div class="field-group">
        <h2 data-i18n="setup.words.title"></h2>
        <p class="hint" data-i18n="setup.words.hint"></p>
        <div id="personal-fields">
          <label class="field">
            <span data-i18n="setup.words.proud"></span>
            <textarea id="in-proud" rows="3" data-i18n-ph="setup.words.proudPh"></textarea>
          </label>
          <label class="field">
            <span data-i18n="setup.words.goal"></span>
            <textarea id="in-goal" rows="3" data-i18n-ph="setup.words.goalPh"></textarea>
          </label>
          <label class="field">
            <span data-i18n="setup.words.childhood"></span>
            <textarea id="in-childhood" rows="3" data-i18n-ph="setup.words.childhoodPh"></textarea>
          </label>
          <label class="field">
            <span data-i18n="setup.words.safeSpace"></span>
            <textarea id="in-safespace" rows="3" data-i18n-ph="setup.words.safeSpacePh"></textarea>
          </label>
          <label class="field">
            <span data-i18n="setup.words.kindness"></span>
            <textarea id="in-kindness" rows="3" data-i18n-ph="setup.words.kindnessPh"></textarea>
          </label>
        </div>
        <button type="button" id="toggle-autowords" class="toggle-btn"><span data-i18n="setup.words.auto"></span><small data-i18n="setup.words.autoSub"></small></button>
      </div>

      <div class="field-group">
        <h2 data-i18n="setup.crisis.title"></h2>
        <p class="hint" data-i18n="setup.crisis.hint"></p>
        <label class="field">
          <span data-i18n="setup.crisis.label"></span>
          <input id="in-crisis" type="tel" autocomplete="off" data-i18n-ph="setup.crisis.ph" />
        </label>
      </div>

      <!-- hidden entirely where the Vibration API is unsupported (iOS) -->
      <div class="field-group hidden" id="haptics-group">
        <h2 data-i18n="setup.haptics.title"></h2>
        <p class="hint" data-i18n="setup.haptics.hint"></p>
        <button type="button" id="toggle-haptics" class="toggle-btn"><span data-i18n="setup.haptics.toggle"></span><small data-i18n="setup.haptics.toggleSub"></small></button>
      </div>

      <div class="field-group">
        <h2 data-i18n="setup.language.title"></h2>
        <p class="hint" data-i18n="setup.language.hint"></p>
        <div class="choice-row" role="radiogroup" data-i18n-aria="setup.language.aria">
          <button class="choice" data-group="lang" data-value="de" data-i18n="setup.language.de"></button>
          <button class="choice" data-group="lang" data-value="en" data-i18n="setup.language.en"></button>
        </div>
      </div>

      <div class="field-group hidden" id="log-group">
        <h2 data-i18n="setup.log.title"></h2>
        <p class="hint" id="log-summary"></p>
        <ul id="log-list"></ul>
        <button id="log-clear" class="ghost-btn" data-i18n="setup.log.clear"></button>
      </div>

      <div class="field-group hidden" id="backup-group">
        <h2 data-i18n="backup.title"></h2>
        <p class="hint" data-i18n="backup.hint"></p>
        <label class="field">
          <span data-i18n="backup.passLabel"></span>
          <input id="backup-pass" type="password" autocomplete="new-password" data-i18n-ph="backup.passPh" />
        </label>
        <div class="voice-row">
          <button type="button" class="voice-btn" id="backup-export" data-i18n="backup.export"></button>
          <button type="button" class="voice-btn" id="backup-import" data-i18n="backup.import"></button>
        </div>
        <input type="file" id="backup-file" accept=".anchor,application/octet-stream" class="hidden" />
        <p class="hint voice-status" id="backup-status"></p>
      </div>

      <p id="save-note" class="hint hidden"></p>
      <button id="setup-save" class="primary-btn" data-i18n="setup.save"></button>
      <p class="privacy-note"><span data-i18n="setup.privacy"></span> <a href="privacy.html" class="privacy-link" data-i18n="setup.privacyLink"></a> · <a href="terms.html" class="privacy-link" data-i18n="setup.termsLink"></a></p>
      <p class="privacy-note" data-i18n="setup.disclaimer"></p>
    </div>
  </section>

  <!-- ============ ONE-TIME DISCLAIMER — before setup, never in panic mode ============ -->
  <section id="screen-consent" class="screen">
    <div class="consent-inner">
      <div class="wordmark">
        <span class="wordmark-dot"></span>
        <span data-i18n="home.wordmark"></span>
      </div>
      <p class="consent-text" data-i18n="consent.text" data-i18n-br></p>
      <button id="btn-consent" class="primary-btn" data-i18n="consent.accept"></button>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen">
    <div class="home-inner">
      <div class="wordmark">
        <span class="wordmark-dot"></span>
        <span data-i18n="home.wordmark"></span>
      </div>
      <div class="home-spacer"></div>
      <button id="btn-panic" class="panic-btn" data-i18n-aria="home.panicAria">
        <span class="panic-btn-text" data-i18n="home.panic" data-i18n-br></span>
      </button>
      <p class="home-hint" data-i18n="home.hint"></p>
      <button id="btn-secondary" class="secondary-btn" data-i18n="home.setup"></button>
      <p class="setup-subtext" data-i18n="home.setupSub"></p>
    </div>
  </section>

  <!-- ============ PANIC MODE ============ -->
  <section id="screen-panic" class="screen">
    <canvas id="pacer"></canvas>
    <div id="breath-glow" aria-hidden="true"></div>

    <div class="panic-top">
      <button id="btn-better" class="soft-link" data-i18n="panic.better"></button>
      <div id="chip-row" class="chip-row"></div>
    </div>

    <!-- first-ever panic session only, before the disclaimer was seen: one quiet line, never a modal -->
    <p id="panic-notice" class="panic-notice hidden"></p>

    <div id="breath-label" class="breath-label" aria-live="polite"></div>

    <div id="affirmation" class="affirmation" aria-live="polite"></div>

    <div id="guide-card" class="grounding hidden" role="dialog" data-i18n-aria="panic.guideAria">
      <p id="guide-step"></p>
      <p id="guide-caution" class="guide-caution hidden"></p>
      <div id="guide-dots" class="dots"></div>
      <p class="grounding-hint" data-i18n="panic.tapContinue"></p>
    </div>

    <div id="panic-bottom" class="panic-bottom">
      <div class="panic-actions">
        <button id="btn-music" class="action-btn music">
          <span class="action-icon">♫</span>
          <span id="music-label"></span>
        </button>
        <a id="btn-call" class="action-btn call hidden" href="#">
          <span class="action-icon">☎</span>
          <span id="call-label"></span>
        </a>
        <a id="btn-call2" class="action-btn call2 hidden" href="#">
          <span class="action-icon">☎</span>
          <span id="call-label2"></span>
        </a>
      </div>

      <!-- shown on this same screen once a call was tapped -->
      <div id="call-fallback" class="call-fallback hidden">
        <p class="fallback-hint" data-i18n="panic.fallbackHint"></p>
        <div class="panic-actions">
          <a id="btn-sms" class="action-btn sms hidden" href="#">
            <span class="action-icon">✉</span>
            <span id="sms-label"></span>
          </a>
          <a id="btn-sms2" class="action-btn sms hidden" href="#">
            <span class="action-icon">✉</span>
            <span id="sms-label2"></span>
          </a>
        </div>
      </div>

      <!-- region-aware, not language-aware: a custom local number replaces the defaults -->
      <p id="crisis-line" class="crisis-line"></p>
    </div>
  </section>

  <!-- ============ AFTER / LOG ============ -->
  <section id="screen-after" class="screen">
    <div class="after-inner">
      <h1 data-i18n="after.title"></h1>
      <p data-i18n="after.body"></p>
      <button id="btn-log" class="primary-btn" data-i18n="after.log"></button>
      <button id="btn-done" class="ghost-btn" data-i18n="after.done"></button>
      <p class="privacy-note" data-i18n="after.note"></p>
    </div>
  </section>

  <script src="i18n/en.js"></script>
  <script src="i18n/de.js"></script>
  <script src="i18n/i18n.js"></script>
  <script src="storage.js"></script>
  <script src="backup.js"></script>
  <script src="app.js"></script>
</body>
</html>
